name: Build Windows exe

# Manually triggered. When you click "Run workflow" GitHub lets you choose the
# branch or tag to build from (the "Use workflow from" dropdown) — that is the
# code that gets built. The version you type is baked into the app (window
# title + About) and into the .exe file properties.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bake in (e.g. 1.2.0 or 1.2.0-beta)"
        required: true
        default: "0.1.0"
      ref:
        description: "Optional: branch/tag/SHA to build (defaults to the ref you selected above)"
        required: false
        default: ""
      make_release:
        description: "Also create a GitHub Release with the zip"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the chosen code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bake in the version
        shell: pwsh
        run: |
          "# Generated by the build workflow`n__version__ = ""${{ inputs.version }}""" | Out-File -Encoding utf8 src/_version.py
          python packaging/make_version_file.py "${{ inputs.version }}"
          Get-Content src/_version.py

      - name: Build one-dir exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name LordOfTheClipboard `
            --add-data "web;web" `
            --add-data "config.default.json;." `
            --collect-all pywebview `
            --collect-submodules pynput `
            --hidden-import win32timezone `
            --version-file packaging/file_version_info.txt `
            run_app.py

      - name: Zip the build
        shell: pwsh
        run: |
          $name = "LordOfTheClipboard-${{ inputs.version }}-win64"
          Compress-Archive -Path dist/LordOfTheClipboard/* -DestinationPath "$name.zip"
          echo "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Lord of the Clipboard v${{ inputs.version }}
          files: ${{ env.ZIP_NAME }}.zip
          generate_release_notes: true
