<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lord of the Clipboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Title / search bar (also the window drag handle) -->
  <header id="titlebar" class="pywebview-drag-region" title="Drag to move">
    <div class="brand">
      <span class="crown">♛</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search clips, sites, apps…  (type to filter)" autocomplete="off" spellcheck="false" />
    </div>
    <div class="titlebar-actions">
      <button id="tab-all"   class="seg active" data-mode="all">All</button>
      <button id="tab-fav"   class="seg" data-mode="fav">★ Favorites</button>
      <button id="tab-days"  class="seg" data-mode="days">By day</button>
      <button id="tab-snip"  class="seg" data-mode="snippets">✎ Snippets</button>
      <button id="btn-new-snippet" class="icon-btn" title="New snippet">＋</button>
      <button id="btn-pin" class="icon-btn" title="Always on top">📌</button>
      <button id="btn-settings" class="icon-btn" title="Settings">⚙</button>
      <button id="btn-close" class="icon-btn" title="Hide (Esc)">✕</button>
    </div>
  </header>

  <!-- Update banner -->
  <div id="updatebar" class="bar hidden no-drag">
    <span id="update-text"></span>
    <span class="bar-actions">
      <button id="update-install" class="btn primary sm">Update now</button>
      <button id="update-later" class="btn sm">Later</button>
    </span>
  </div>

  <!-- Pin bar: F1–F9 favorites -->
  <div id="pinbar" class="pinbar no-drag"></div>

  <div id="main">
    <!-- Filter sidebar -->
    <aside id="sidebar" class="no-drag">
      <div class="side-section">
        <div class="side-title">Days</div>
        <ul id="day-filter" class="side-list"></ul>
      </div>
      <div class="side-section">
        <div class="side-title">Types</div>
        <ul id="type-filter" class="side-list"></ul>
      </div>
      <div class="side-section">
        <div class="side-title">Sites</div>
        <ul id="domain-filter" class="side-list"></ul>
      </div>
      <div class="side-section">
        <div class="side-title">Apps</div>
        <ul id="app-filter" class="side-list"></ul>
      </div>
    </aside>

    <!-- Clip list -->
    <main id="list" class="no-drag" tabindex="0"></main>
  </div>

  <!-- Stack bar: shown while clips are Ctrl+clicked into a merge stack -->
  <div id="stackbar" class="bar hidden no-drag">
    <span id="stack-count"></span>
    <span class="bar-actions">
      <label class="sep-label">join with
        <select id="stack-sep">
          <option value="&#10;">new line</option>
          <option value=" ">space</option>
          <option value=", ">comma</option>
          <option value="&#10;&#10;">blank line</option>
        </select>
      </label>
      <button id="stack-paste" class="btn primary sm">Paste stack</button>
      <button id="stack-clear" class="btn sm">Clear</button>
    </span>
  </div>

  <footer id="statusbar">
    <span id="active-filters"></span>
    <span id="pick-status" class="pick-status"></span>
    <span class="hint">Enter paste · Ctrl+click to stack · F1–F9 pins · Ctrl+Shift+number to pick · Esc hide</span>
  </footer>

  <!-- Context menu -->
  <div id="ctx" class="ctx hidden no-drag"></div>

  <!-- Settings modal -->
  <div id="settings" class="modal hidden no-drag">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn">✕</button>
      </div>
      <div class="modal-body" id="settings-body"></div>
      <div class="modal-foot">
        <button id="settings-save" class="btn primary">Save</button>
        <button id="settings-cancel" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
